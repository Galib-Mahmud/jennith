name: nail_gpt
description: NailGPT - AI Powered Nail Tech App

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  get:
  shared_preferences:
  http:
  image_picker:

  pin_code_fields: ^8.0.0

  # Responsive UI
  flutter_screenutil:

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true

  # Add your assets here when you have them:
  assets:
    - assets/images/
